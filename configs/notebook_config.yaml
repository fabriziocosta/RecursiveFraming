common:
  output_root: outputs
  pubmed_email: xfcosta@gmail.com
  pubmed_api_key_env: PUBMED_API_KEY
  openai_api_key_env: OPENAI_API_KEY
  openai_model_env: OPENAI_MODEL
  openai_model: gpt-4o-mini
  pubmed_tool: recursive-framing-graphicalizer
  pubmed_retries: 3
  pubmed_search_page_size: 1000
  pubmed_fetch_batch_size: 200
  pathogens:
    Coxiella burnetii:
    - Coxiella
    - C. burnetii
  corpus_subdir: pubmed_screening
  corpus_filename: corpus_articles.parquet
  corpus_pathogens: null
  corpus_start_year: null
  corpus_end_year: null
  assembled_ontology_relative_path: assets/ontologies/entity_ontology_microbiology_assembled.yaml
  base_ontology_relative_path: assets/ontologies/entity_ontology_microbiology.yaml
  prompt_relative_path: assets/prompts/graphicalizer_prompt_template.yaml
  prompt_snapshot_relative_path: outputs/prompts/ontology-aware-graphicalizer-0.4.0.yaml
  graph_store_subdir: outputs/graphs
  graph_id_prefix: pubmed
  llm_provider: openai
  ollama_model: gemma4:12b-mlx
  openai_max_output_tokens: 16384
  ollama_num_ctx: 32768
  ollama_num_predict: -1
  embedding_model_name: all-MiniLM-L6-v2
  entities_per_word: 0.05
  relations_per_entity: 1.5
  minimum_entity_fraction: 0.75
  density_retries: 2
  max_context_sentences: 3
  max_evidence_items: 2
  include_evidence: true
  include_uncertainty: true
  disconnected_policy: largest_component
  context_policy: all_nodes
  casting_retries: 2
  llm_retries: 3
  llm_max_calls: null
  llm_save_every: 10
  resume: true
  retry_failed_llm_rows: false
  debug_mode: true
  debug_abstracts_per_pathogen: 5
  debug_pathogens:
    Coxiella burnetii:
    - Coxiella
    - C. burnetii
    Bacillus subtilis:
    - Bacillus subtilis
    - B. subtilis
notebook_01_zoonotic_bacterial_species:
  query: ("zoonosis"[Title/Abstract] OR "zoonotic"[Title/Abstract] OR "zoonoses"[Title/Abstract]
    OR spillover[Title/Abstract] OR "animal-to-human"[Title/Abstract] OR "animal to
    human"[Title/Abstract])
  pubmed_max_results: 5
  output_subdir: pubmed_screening/zoonosis_species
  articles_filename: zoonosis_pubmed_articles.parquet
  title_extractions_filename: title_species_extraction.parquet
  abstract_extractions_filename: abstract_species_extraction.parquet
  summary_path: assets/zoonotic_bacterial_species.parquet
  openai_max_tokens: 512
  run_abstract_stage: true
  abstract_input_mode: title_positive
notebook_02_pubmed_abstract_download:
  search_bundle_dir: assets/search_bundles
  search_bundles:
  - filename: pubmed_animal_evidence.yaml
    search_type: animal
  - filename: pubmed_zoonosis_evidence.yaml
    search_type: zoonosis
  pubmed_max_results_per_query: 5000
  openai_max_tokens: 1024
notebook_03_pubmed_pathogen_category:
  refined_corpus_filename: refined_corpus_articles.parquet
  openai_max_tokens: 1024
notebook_04_assemble_microbiology_ontology:
  term_budget: 500
  abstraction_level: 2
  include_ncbitaxon: false
notebook_05_semantic_abstraction:
  pubmed_abstract_index: 0
  graph_output_relative_path: outputs/selected_ontology_graph.svg
  narrative_columns: 80
  subgraph_node_count: 3
  subgraph_seed: null
  narrative_words: 100
  subgraph_output_relative_path: outputs/selected_random_subgraph.svg
  narrative_prompt_relative_path: assets/prompts/subgraph_narrative_prompt_template.yaml
  narrative_snapshot_relative_path: outputs/prompts/subgraph-narrator-0.1.0.yaml
notebook_06_batch_semantic_abstraction:
  continue_on_error: true
